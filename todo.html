<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo List</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
    }

    input {
      padding: 8px;
      width: 220px;
    }

    button {
      padding: 8px 10px;
      margin: 5px;
      cursor: pointer;
    }

    ul {
      padding: 0;
    }

    li {
      list-style: none;
      margin: 10px;
    }

    .completed {
      text-decoration: line-through;
      color: gray;
    }
  </style>
</head>

<body>

  <h2>Todo List</h2>

  <input type="text" id="taskInput" placeholder="Enter task">
  <button onclick="addTask()">Add</button>

  <br><br>

  <button onclick="setFilter('all')">All</button>
  <button onclick="setFilter('completed')">Completed</button>
  <button onclick="setFilter('pending')">Pending</button>

  <ul id="taskList"></ul>

  <script>
    let tasks = [];
    let filter = "all";

    // Add Task
    const addTask = () => {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();

      if (text === "") return;

      const newTask = {
        id: Date.now(),
        text: text,
        completed: false
      };

      tasks.push(newTask); // simple and clear
      input.value = "";

      renderTasks();
    };

    // Delete Task
    const deleteTask = (id) => {
      tasks = tasks.filter(task => task.id !== id);
      renderTasks();
    };

    // Toggle Complete
    const toggleTask = (id) => {
      tasks = tasks.map(task => {
        if (task.id === id) {
          return {
            ...task,
            completed: !task.completed
          };
        }
        return task;
      });

      renderTasks();
    };

    // Set Filter
    const setFilter = (type) => {
      filter = type;
      renderTasks();
    };

    // Render Tasks
    const renderTasks = () => {
      const list = document.getElementById("taskList");

      let filteredTasks = [];

      if (filter === "completed") {
        filteredTasks = tasks.filter(task => task.completed);
      } else if (filter === "pending") {
        filteredTasks = tasks.filter(task => !task.completed);
      } else {
        filteredTasks = tasks;
      }

      list.innerHTML = filteredTasks.map(task => `
        <li>
          <span 
            class="${task.completed ? 'completed' : ''}" 
            onclick="toggleTask(${task.id})"
            style="cursor:pointer"
          >
            ${task.text}
          </span>
          <button onclick="deleteTask(${task.id})">X</button>
        </li>
      `).join("");
    };
  </script>

</body>
</html>
